[project]
name = "mmsim"
version = "0.1.0"
description = "Limit order book simulation of market making under adverse selection and latency."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.18,<1.19",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Windows Smart App Control on the development machine blocks the mypyc-compiled mypy
# wheels and the compiled librt runtime required by mypy>=1.19, so mypy is pinned below
# 1.19 and installed from source as pure Python.
no-binary-package = ["mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "NPY", # numpy-specific rules
    "PT",  # flake8-pytest-style
    "RUF", # ruff-specific rules
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D105", # magic methods are self-explanatory
    "D107", # __init__ parameters are documented on the class (NumPy convention)
]
allowed-confusables = ["−", "–", "α", "γ"] # typography and symbols in figure labels

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
